# =============================================================================
#  Build & test: chạy trên Ubuntu, dùng SQL Server container cho integration test
# =============================================================================
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433

    env:
      HTNLSHOP_TEST_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=Str0ng!Passw0rd;TrustServerCertificate=True"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Đợi SQL Server sẵn sàng
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1; then
              echo "SQL Server đã mở cổng 1433"; exit 0
            fi
            sleep 2
          done
          echo "SQL Server không khởi động kịp"; exit 1

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Test + coverage
        run: >
          dotnet test --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --settings tests/HTNLShop.Tests/coverlet.runsettings
          --results-directory ./coverage
          --logger "trx;LogFileName=test-results.trx"

      - name: Kiểm tra gói có lỗ hổng đã biết
        run: dotnet list package --vulnerable --include-transitive

      - name: Upload kết quả test & coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ./coverage
            **/TestResults/**/*.trx

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t htnlshop:${{ github.sha }} .
